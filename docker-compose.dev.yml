# Myriad 本地开发 Docker Compose 配置
#
# 默认仅启动 PostgreSQL 数据库供本地开发使用：
#   - backend: 在宿主机 `cargo run --bin myriad-backend`
#   - frontend: 在宿主机 `pnpm dev`（frontend/）
#
# 使用方法:
#   启动 DB: docker compose -f docker-compose.dev.yml up -d postgres
#   启动 updater 测试 harness: ./scripts/dev.sh start updater
#   停止: docker compose -f docker-compose.dev.yml down
#   日志: docker compose -f docker-compose.dev.yml logs -f
#
# ============================================================================
# 与生产部署 (docker-compose.yml) 的区别
# ============================================================================
# 本文件默认不启动 proxy/updater；updater 通过 profile 按需启动，并暴露到
# 127.0.0.1:1101 供宿主机 backend 的 /api/admin/updater/* 代理测试。
# 若要验证真实业务容器替换流程，请使用 docker-compose.yml 配合
# scripts/extra/deploy.sh。
#
# pgdata 也使用独立 named volume (postgres_dev_data)，避免污染生产 ./pgdata。
# ============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: myriad-postgres-dev
    environment:
      POSTGRES_DB: myriad
      POSTGRES_USER: myriad
      POSTGRES_PASSWORD: myriad_dev_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myriad -d myriad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  docker-guard:
    profiles: ["updater"]
    build:
      context: .
      dockerfile: updater/Dockerfile
      args:
        MYRIAD_VERSION: ${UPDATER_TAG:-v0.0.0-dev}
        CARGO_PROFILE: dev
    image: ${UPDATER_IMAGE:-myriad-updater-dev}:${UPDATER_TAG:-v0.0.0-dev}
    container_name: myriad-docker-guard-dev
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/myriad-docker-guard"]
    environment:
      COMPOSE_PROJECT_NAME: myriad-dev-updater
      MYRIAD_DOCKER_NETWORK: myriad-dev-updater_default
      MYRIAD_ADMIN_NETWORK: myriad-dev-admin-net
      MYRIAD_DOCKER_GUARD_NETWORK: myriad-dev-docker-guard-net
      DOCKER_GUARD_EXPECTED_IMAGE: ${UPDATER_IMAGE:-myriad-updater-dev}:${UPDATER_TAG:-v0.0.0-dev}
      DOCKER_GUARD_HOST_POLICY_PATH: /guard-policy/docker-guard.env
      DOCKER_GUARD_SELF_UPDATE_TOKEN: ${GUARD_SELF_UPDATE_TOKEN:-dev-guard-self-update-token-32chars!!}
      # Dev-only escape hatch; Guard rejects it in release builds.
      DOCKER_GUARD_ALLOW_UNPINNED_DEV: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.dev-updater:/host/compose:ro
      - ./.dev-updater/guard-policy:/guard-policy
    networks: [docker-guard-net]
    read_only: true
    tmpfs: [/tmp, /run]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  updater:
    profiles: ["updater"]
    build:
      context: .
      dockerfile: updater/Dockerfile
      args:
        MYRIAD_VERSION: ${UPDATER_TAG:-v0.0.0-dev}
        CARGO_PROFILE: dev
    image: ${UPDATER_IMAGE:-myriad-updater-dev}:${UPDATER_TAG:-v0.0.0-dev}
    container_name: myriad-updater-dev
    environment:
      UPDATE_TOKEN: ${UPDATE_TOKEN:-9xQ3vN8mP2rT5wY7zA1bC4dF6hJ8kL0n}
      CHANNEL: ${CHANNEL:-stable}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}
      MYRIAD_GITHUB_REPO: ${MYRIAD_GITHUB_REPO:-Myriad-You/Myriad}
      CHECK_INTERVAL_SECS: ${CHECK_INTERVAL_SECS:-0}
      UPDATER_STATE_DIR: /host/compose/state
      UPDATER_COMPOSE_DIR: /host/compose
      UPDATER_ENV_FILE: /host/compose/.env
      UPDATER_PGDATA: /host/compose/pgdata
      UPDATER_LISTEN: 0.0.0.0:1101
      DOCKER_HOST: tcp://docker-guard:2375
      DOCKER_GUARD_SELF_UPDATE_TOKEN: ${GUARD_SELF_UPDATE_TOKEN:-dev-guard-self-update-token-32chars!!}
      UPDATER_GUARD_ENV_FILE: /run/secrets/docker-guard.env
      COMPOSE_PROJECT_NAME: myriad-dev-updater
      MYRIAD_VERSION: ${UPDATER_TAG:-v0.0.0-dev}
      TZ: Asia/Shanghai
    volumes:
      - ./.dev-updater:/host/compose:ro
      - ./.dev-updater/.env:/host/compose/.env:rw
      - ./.dev-updater/state:/host/compose/state:rw
      - ./.dev-updater/pgdata:/host/compose/pgdata:rw
      - ./.dev-updater/guard-policy:/run/secrets:ro
    ports:
      - "127.0.0.1:1101:1101"
    networks: [admin-net, docker-guard-net]
    depends_on:
      docker-guard: { condition: service_healthy }
    restart: unless-stopped

  updater-gateway:
    profiles: ["updater"]
    build:
      context: .
      dockerfile: updater/Dockerfile
      args:
        MYRIAD_VERSION: ${UPDATER_TAG:-v0.0.0-dev}
        CARGO_PROFILE: dev
    image: ${UPDATER_IMAGE:-myriad-updater-dev}:${UPDATER_TAG:-v0.0.0-dev}
    container_name: myriad-updater-gateway-dev
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/myriad-updater-gateway"]
    environment:
      UPDATE_TOKEN: ${UPDATE_TOKEN:-9xQ3vN8mP2rT5wY7zA1bC4dF6hJ8kL0n}
      UPDATER_GATEWAY_SECRET: ${UPDATER_GATEWAY_SECRET:-dev-updater-gateway-secret-32chars!!}
      UPDATER_UPSTREAM: http://updater:1101
      GATEWAY_LISTEN: 0.0.0.0:1104
      TZ: Asia/Shanghai
    ports:
      # Host backend: MYRIAD_UPDATER_URL=http://127.0.0.1:1104 + UPDATER_GATEWAY_SECRET
      # (no UPDATE_TOKEN on backend).
      - "127.0.0.1:1104:1104"
    networks: [admin-net]
    depends_on:
      - updater
    read_only: true
    tmpfs: [/tmp, /run]
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local

networks:
  admin-net:
    name: myriad-dev-admin-net
  docker-guard-net:
    name: myriad-dev-docker-guard-net
    internal: true
