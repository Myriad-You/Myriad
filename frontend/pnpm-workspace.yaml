minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
    # braces <=3.0.3 has no patched release (2026-10-03). It is only pulled by
    # Stylelint's dev-time glob matching; scripts/config supply fixed patterns,
    # never runtime user input. Revisit when braces/Stylelint ships a fix or
    # untrusted patterns are accepted. See .github/dependency-audit/README.md.
    - GHSA-vfj7-8cjw-p6xm
# TUI / --detach start redirects stdin to /dev/null. pnpm 11's
# verifyDepsBeforeRun=install then aborts with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY when it needs to
# recreate node_modules after a lockfile change.
confirmModulesPurge: false
# Force current majors so transitive deps never land on:
#   - semver@6.x  (@babel/* still declares ^6; 6.3.1 false-positives no-downgrade
#                 because 7.x published provenance first)
# ua-parser-js is excluded from no-downgrade on purpose: Agora still declares
# ^0.7 (MIT). 0.7.41 has no provenance, and 2.x (which does) is AGPL-3.0-or-later.
# Pin the last 0.7 MIT release; do not float — 0.7.29–0.7.33 had protestware.
# Agora's optional ESM tree stays off the Vite prebundle (vite.config
# optimizeDeps.exclude) so install policy cannot freeze the crawler.
trustPolicyExclude:
  - ua-parser-js

shellEmulator: true

overrides:
  brace-expansion: '>=5.0.12'
  chokidar: '>=5.0.0'
  colord: ^2.10.0
  fast-uri: '>=4.1.5'
  js-yaml: ^4.3.2
  nanoid: 3.3.18
  postcss: '>=8.5.28'
  semver: '>=7.8.5'
  # GHSA-68fv-2mgg-jv7q: reject malformed indexed source-map offsets.
  source-map-js: ^1.2.2
  svgo: '>=4.1.0'
  # GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr: worker option hardening.
  tinypool: ^2.1.2
  ua-parser-js: 0.7.41
# React 19: motion.div 把 [MeasureLayout, html] 无 key 塞进 Context，开发态会报
# "Each child in a list should have a unique key" / <Context> ← ForwardRef(motion.div)。
# 上游未修。升级 motion 后若 patch 对不上，重打这一处即可。
patchedDependencies:
  framer-motion@13.2.0: patches/framer-motion@13.2.0.patch

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
  - sharp
