allowBuilds:
  esbuild: true
auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
shellEmulator: true
trustPolicy: no-downgrade
# Force current majors so transitive deps never land on:
#   - semver@6.x  (@babel/* still declares ^6; 6.3.1 false-positives no-downgrade
#                 because 7.x published provenance first)
#   - chokidar@4  (@astrojs/check still declares ^4; 4.0.3 false-positives because
#                 paulmillr stopped attaching provenance after 4.0.1)
# Both only use APIs present in the newer major. Prefer overrides over
# trustPolicyExclude so install stays strict and the tree stays current.
overrides:
  brace-expansion: '>=5.0.9'
  chokidar: '>=5.0.0'
  fast-uri: '>=3.1.5'
  nanoid: 3.3.18
  postcss: '>=8.5.23'
  semver: '>=7.8.5'
  svgo: '>=4.0.2'
onlyBuiltDependencies:
  - esbuild
  - sharp
