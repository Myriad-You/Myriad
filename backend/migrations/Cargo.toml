[package]
name = "migration"
version = "0.4.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "lib.rs"

[dependencies]
sea-orm-migration = { version = "2.0", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }

[dependencies.sea-orm]
version = "2.0"
default-features = false
features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
]

[dependencies.serde_json]
version = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
