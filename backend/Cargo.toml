[package]
name = "myriad-backend"
version = "0.4.1"
edition = "2021"
rust-version = "1.94"
authors = ["Myriad Contributors"]
description = "Backend service for Myriad — a myriad of lights, in one place."

[[bin]]
name = "myriad-backend"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "fs",
    "cors",
    "trace",
    "set-header",
    "compression-gzip",
    "compression-br",
] }
# Limited body streams for live memory-profile body caps (also via axum)
http-body-util = "0.1"

# Database
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }

# Local migrations module
migration = { path = "migrations" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
myriad-tapp-contract = { path = "../crates/tapp-contract" }
myriad-error = { path = "../crates/myriad-error" }
myriad-data-key = { path = "../crates/myriad-data-key" }
myriad-merope = { path = "../crates/myriad-merope" }
myriad-image-proxy = { path = "../crates/myriad-image-proxy" }
myriad-json-schema = { path = "../crates/myriad-json-schema" }
myriad-outbound = { path = "../crates/myriad-outbound" }
myriad-platform-utils = { path = "../crates/myriad-platform-utils" }
myriad-tapp-registry = { path = "../crates/myriad-tapp-registry" }
myriad-prompt-security = { path = "../crates/myriad-prompt-security" }
myriad-agent-rules = { path = "../crates/myriad-agent-rules" }
myriad-brew-notes = { path = "../crates/myriad-brew-notes" }
myriad-tapp-rules = { path = "../crates/myriad-tapp-rules" }
myriad-module-visibility = { path = "../crates/myriad-module-visibility" }
myriad-process-info = { path = "../crates/myriad-process-info" }
myriad-psn-auth = { path = "../crates/myriad-psn-auth" }
semver = "1.0"

# HTTP client
# reqwest 0.13: `form` is a separate feature (needed for OIDC/Discord/PSN token POSTs);
# default TLS is rustls (`rustls-tls` renamed to `rustls`).
reqwest = { version = "0.13", features = ["json", "cookies", "multipart", "form"] }
url = "2"
urlencoding = "2.1"

# Authentication & Authorization
# oauth2's bundled client is reqwest 0.12; use oauth2-reqwest for 0.13 AsyncHttpClient.
# Pin alpha exactly — caret would float across breaking 0.1.0-alpha.* releases.
oauth2 = { version = "5", default-features = false }
oauth2-reqwest = "=0.1.0-alpha.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# Digest generation group (must move together for trait compatibility):
# rsa 0.10 → digest 0.11 + sha2 0.11 + rand_core 0.10; hmac 0.13 → digest 0.11.
# Do not bump sha2 alone. rsa 0.10 is still rc until a stable release lands.
sha2 = "0.11"
hex = "0.4"
argon2 = "0.5"
regex = "1.13"
hmac = "0.13"        # Tencent Cloud API signing; digest 0.11 to match sha2 0.11
base64 = "0.23"      # For audio data encoding
flate2 = "1"         # zlib inflate for KuGou KRC (逐字歌词) decode
# `image` crate removed: no in-process decode path; proxy streams bytes only.

# Federation (MFP - Myriad Federation Protocol)
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }  # RSA keygen/signing (digest 0.11)
aes-gcm = "0.11"     # AES-256-GCM for private key encryption + E2E message AEAD
rand_core = "0.10"   # RNG traits compatible with rsa 0.10 (OsRng lives in `rand` 0.10)
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }  # Channel/Room E2E ECDH
subtle = "2.6"       # Constant-time comparison for digest/signature verification

# Configuration
dotenvy = "0.15"

# Error handling
anyhow = "1.0"

# Async trait support (used by services/oauth provider abstraction)
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"                                           # For cron expression parsing
uuid = { version = "1.24", features = ["v4", "serde"] }
rand = "0.10"
lazy_static = "1.5"
once_cell = "1.21"
ipnet = "2"                                             # TRUST_PROXY_PEERS CIDR allowlist
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"                                    # For SSE streaming
zip = "8.6"                                             # For .tapp file handling
md5 = "0.8"
quick-xml = "0.41.0"
serde_yaml = "0.9.34"
scraper = "0.27"                                        # HTML parsing for web.scrape capability

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

# release profile lives in the root workspace Cargo.toml
