[package]
name = "myriad-backend"
version = "0.3.12"
edition = "2021"
authors = ["Myriad Contributors"]
description = "Backend service for Myriad — a myriad of lights, in one place."

[[bin]]
name = "myriad-backend"
path = "src/main.rs"

[features]
tapp-contract-schema = ["dep:schemars"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "fs",
    "cors",
    "trace",
    "set-header",
    "compression-gzip",
    "compression-br",
] }

# Database
# sea-orm 2.0 is a major rewrite; skipped until a dedicated migration
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = "1.1"

# Local migrations module
migration = { path = "migrations" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
myriad-tapp-contract = { path = "../crates/tapp-contract" }
semver = "1.0"
schemars = { version = "1.0", optional = true }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies"] }  # pinned: oauth2 5.0 only impls AsyncHttpClient for reqwest 0.12
url = "2"
urlencoding = "2.1"

# Authentication & Authorization
oauth2 = "5.0"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
sha2 = "0.10"        # pinned: rsa 0.9 federation signing requires digest 0.10
hex = "0.4"
argon2 = "0.5"
regex = "1.13"
hmac = "0.12"        # For Tencent Cloud API signing; digest 0.10 to match sha2 0.10
base64 = "0.22"      # For audio data encoding
flate2 = "1"         # zlib inflate for KuGou KRC (逐字歌词) decode

# Federation (MFP - Myriad Federation Protocol)
rsa = { version = "0.9", features = ["pem", "sha2"] }  # RSA key generation & signing
aes-gcm = "0.10"     # AES-256-GCM for private key encryption + E2E message AEAD
rand_core = { version = "0.6", features = ["getrandom"] }  # RNG compatible with rsa 0.9
x25519-dalek = { version = "2", features = ["static_secrets"] }  # Channel/Room E2E ECDH
subtle = "2.6"       # Constant-time comparison for digest/signature verification

# Configuration
dotenvy = "0.15"

# Error handling
anyhow = "1.0"

# Async trait support (used by services/oauth provider abstraction)
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17"                                           # For cron expression parsing
uuid = { version = "1.24", features = ["v4", "serde"] }
rand = "0.10"
lazy_static = "1.5"
once_cell = "1.21"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"                                    # For SSE streaming
zip = "8.6"                                             # For .tapp file handling
md5 = "0.8"
quick-xml = "0.41.0"
serde_yaml = "0.9.34"
scraper = "0.27"                                        # HTML parsing for web.scrape capability

[dev-dependencies]
mockall = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
