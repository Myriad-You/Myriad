[package]
name = "myriad-updater"
version = "0.3.2"
edition = "2021"
authors = ["Myriad Contributors"]
description = "Self-update daemon for Myriad: maintenance-mode + single-slot updates with file-level pgdata snapshots."
license = "AGPL-3.0-only"

[[bin]]
name = "myriad-updater"
path = "src/bin/updater.rs"

[[bin]]
name = "myriad-rescue"
path = "src/bin/rescue.rs"

[[bin]]
name = "myriad-tcb-self-update"
path = "src/bin/myriad-tcb-self-update.rs"

[[bin]]
name = "myriad-updater-gateway"
path = "src/bin/myriad-updater-gateway.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "signal", "sync", "time", "io-util"] }
futures = "0.3"

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# HTTP client (GitHub API). rustls to keep the binary musl-static-friendly.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "stream"] }

# Docker engine API
bollard = { version = "0.21", default-features = false, features = ["ssl", "pipe"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Filesystem & syscalls
fs2 = "0.4"                                  # file locking (flock)
nix = { version = "0.31", features = ["fs"] } # fsync directory, etc.
tempfile = "3"
walkdir = "2"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
time = "0.3"

# Misc
once_cell = "1"
regex = "1"
semver = "1"
hex = "0.4"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
pretty_assertions = "1"
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
