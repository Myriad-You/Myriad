[package]
name = "myriad-tapp-contract"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[features]
tapp-contract-schema = ["dep:schemars"]

[dependencies]
http = "1"
percent-encoding = "2"
schemars = { version = "1.0", optional = true }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
