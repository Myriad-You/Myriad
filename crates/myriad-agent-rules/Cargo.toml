[package]
name = "myriad-agent-rules"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure Agent rules extracted from backend *_pure modules."
authors = ["Myriad Contributors"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
