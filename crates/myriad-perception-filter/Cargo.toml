[package]
name = "myriad-perception-filter"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host-side privacy filter for what a client sees on its owner's screen: pure rules, no I/O."
authors = ["Myriad Contributors"]
license = "AGPL-3.0-only"

[dependencies]
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
