[package]
name = "myriad-blog"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure blog export rules: Hugo files, MathML, slugs, and theme checks."
authors = ["Myriad Contributors"]

[dependencies]
latex2mathml = "0.2"
lol_html = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
myriad-phantasi = { path = "../myriad-phantasi" }
