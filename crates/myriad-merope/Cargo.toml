[package]
name = "myriad-merope"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure Merope domain rules and contracts for Myriad."
authors = ["Myriad Contributors"]
license = "AGPL-3.0-only"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
earcutr = "0.5"
myriad-agent-rules = { path = "../myriad-agent-rules" }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
url = "2"

[features]
# A seat game with private seats and nothing else, for tests of how a game she
# hosts reaches its players (the group recordings turn it on).
test-games = []

[build-dependencies]
serde_json = "1"

[dev-dependencies]
# The group trajectories (fixtures/group, recorded locally, not in the
# repository) are compared after a trip through
# JSON: read numbers back to the exact bits they were written from.
serde_json = { version = "1", features = ["float_roundtrip"] }
