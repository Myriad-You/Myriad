[package]
name = "myriad-outbound"
version = "0.1.0"
edition = "2021"
publish = false
description = "SSRF-resistant outbound HTTP client helpers for Myriad (DNS pin, public IP, body cap)."
authors = ["Myriad Contributors"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
tokio = { version = "1", features = ["net", "sync"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
