[package]
name = "myriad-psn-auth"
version = "0.1.0"
edition = "2021"
publish = false
description = "PlayStation Network NPSSO → access_token exchange with TTL cache (shared by fetcher + game presence)."
authors = ["Myriad Contributors"]
license = "AGPL-3.0-only"

[dependencies]
myriad-outbound = { path = "../myriad-outbound" }
serde_json = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
