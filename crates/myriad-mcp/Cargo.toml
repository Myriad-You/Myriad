[package]
name = "myriad-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
description = "Bounded MCP client lifecycle and transports"

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
