[package]
name = "myriad-tapp-registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "PostgreSQL-backed Tapp runtime registry and mailbox (shared leases across replicas)."
authors = ["Myriad Contributors"]
license = "AGPL-3.0-only"

[dependencies]
# Align with backend: sea-orm 2.0 + tokio runtime
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
