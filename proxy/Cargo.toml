[package]
name = "myriad-proxy"
version = "0.3.35"
edition = "2021"
rust-version = "1.94"
authors = ["Myriad Contributors"]
description = "Minimal maintenance-aware reverse proxy for Myriad."
license = "AGPL-3.0-only"

[[bin]]
name = "myriad-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal", "time"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
hyper = { version = "1", features = ["client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
once_cell = "1"
ipnet = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# Docker/CI image builds (see root Cargo.toml for rationale).
[profile.ci-release]
inherits = "release"
lto = "thin"
codegen-units = 16
