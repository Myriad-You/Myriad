# Shared cargo-audit config for workspace + updater lockfiles (MYR-027).
# Auto-loaded by `cargo audit` from this path (.cargo/audit.toml).
# Policy docs: .github/dependency-audit/README.md
#
# Policy:
# - Hard gate: unignored *vulnerabilities* fail CI (see dependency-audit job).
# - Soft gate: unmaintained / unsound / yanked (--deny warnings) reports only.
# - Prefer fixing or upgrading; ignore only when accepted with a written reason.
#
# Severity note: cargo-audit does not filter by CVSS. Medium-or-lower advisories
# with no practical fix are listed here so high/critical signal stays actionable.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa "Marvin Attack" timing sidechannel (CVSS ~5.9 medium).
    # No fixed crate release; pulled transitively (e.g. jsonwebtoken). Track upstream
    # rsa/jsonwebtoken for a fix; re-evaluate when a patched rsa ships.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0235 — rkyv 0.7 archive validation. rkyv is only an
    # inactive optional dependency recorded through
    # sea-orm-migration -> sea-orm -> rust_decimal; `cargo tree -i rkyv`
    # is empty and CI fails if that changes. SeaORM 2.0.1 unconditionally
    # enables sea-orm defaults, so there is no upstream-compatible lockfile
    # upgrade to rkyv >=0.8.17. Revisit when SeaORM/rust_decimal removes or
    # upgrades the optional rkyv 0.7 dependency.
    "RUSTSEC-2026-0235",
]
