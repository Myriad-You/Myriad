name: Build and Push Development Images

# Dev/commit image packaging:
# - push to main/preview/beta: only builds when the commit title contains `-p`
# - workflow_dispatch: always builds (optional tag / components inputs)
# Production releases are owned by release.yml on tag push.
#
# NOTE: This workflow MUST NOT push the `latest` tag — the updater relies on
# immutable version tags to roll back reliably.

on:
  push:
    branches:
      - main
      - preview
      - beta
  workflow_dispatch:
    inputs:
      tag:
        description: "Override docker image tag (optional)"
        required: false
      components:
        description: "Comma-separated components (default: backend,frontend,proxy; pass updater to include it)"
        required: false
        default: "backend,frontend,proxy"

env:
  REGISTRY: docker.io
  # Updater is release-only by default (release.yml on tag push). Include via
  # `components` input when a dev updater image is needed.
  DEFAULT_COMPONENTS: backend,frontend,proxy

jobs:
  should-build:
    name: Check package trigger
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
    steps:
      - id: check
        env:
          # Full commit message (title + body); title is the first line.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >>"$GITHUB_OUTPUT"
            echo "skip_reason=" >>"$GITHUB_OUTPUT"
            echo "Manual dispatch — will package"
            exit 0
          fi
          # Match rule: commit title (first line) contains substring `-p`.
          TITLE=$(printf '%s\n' "$COMMIT_MSG" | head -n1)
          echo "Commit title: $TITLE"
          if printf '%s\n' "$TITLE" | grep -qF -- '-p'; then
            echo "should_build=true" >>"$GITHUB_OUTPUT"
            echo "skip_reason=" >>"$GITHUB_OUTPUT"
            echo "Title contains -p — will package"
          else
            echo "should_build=false" >>"$GITHUB_OUTPUT"
            echo "skip_reason=commit title has no -p" >>"$GITHUB_OUTPUT"
            echo "Title has no -p — skip package"
          fi

  # Always runs so GitHub UI shows an explicit skip (not a quiet green empty workflow).
  packaging-status:
    name: Packaging status
    needs: should-build
    runs-on: ubuntu-latest
    steps:
      - name: Report packaging decision
        env:
          SHOULD_BUILD: ${{ needs.should-build.outputs.should_build }}
          SKIP_REASON: ${{ needs.should-build.outputs.skip_reason }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Dev image packaging"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Packaging will run: workflow_dispatch"
            {
              echo "**Result:** packaging **will run** (manual \`workflow_dispatch\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$SHOULD_BUILD" = "true" ]; then
            echo "Packaging will run: commit title contains -p"
            {
              echo "**Result:** packaging **will run** (commit title contains \`-p\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          REASON="${SKIP_REASON:-commit title has no -p}"
          echo "Packaging skipped: $REASON"
          {
            echo "**Result:** packaging **skipped** — $REASON"
            echo ""
            echo "No Docker images were built or pushed."
            echo "To package on push, include \`-p\` in the **commit title**, or run this workflow via **workflow_dispatch**."
          } >> "$GITHUB_STEP_SUMMARY"

  resolve:
    name: Resolve components
    needs: should-build
    if: needs.should-build.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          # Push defaults to backend/frontend/proxy. Updater is packaged on
          # release tags (release.yml); workflow_dispatch may pass updater.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.components }}"
            INPUT="${INPUT:-$DEFAULT_COMPONENTS}"
          else
            INPUT="$DEFAULT_COMPONENTS"
          fi
          # Convert "backend,frontend,proxy" to JSON array.
          MATRIX=$(echo "$INPUT" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$' \
            | jq -R . | jq -s -c .)
          echo "matrix=$MATRIX" >>"$GITHUB_OUTPUT"
          echo "Building: $MATRIX"

  build-and-push:
    name: Build ${{ matrix.component }}
    needs: [should-build, resolve]
    if: needs.should-build.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute dockerfile path
        id: paths
        run: |
          case "${{ matrix.component }}" in
            backend)  echo "dockerfile=docker/Dockerfile.backend"  >>"$GITHUB_OUTPUT" ;;
            frontend) echo "dockerfile=docker/Dockerfile.frontend" >>"$GITHUB_OUTPUT" ;;
            proxy)    echo "dockerfile=proxy/Dockerfile"           >>"$GITHUB_OUTPUT" ;;
            updater)  echo "dockerfile=updater/Dockerfile"         >>"$GITHUB_OUTPUT" ;;
            *)        echo "::error::unknown component: ${{ matrix.component }}"; exit 1 ;;
          esac

      - name: Check Dockerfile presence
        id: check
        run: |
          if [ -f "${{ steps.paths.outputs.dockerfile }}" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::Dockerfile ${{ steps.paths.outputs.dockerfile }} missing; skipping"
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/myriad-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=dev-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          # `latest` intentionally omitted; release.yml owns release tags.

      - name: Build and push
        if: steps.check.outputs.present == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.paths.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PNPM_VERSION=10.28.2
            MYRIAD_VERSION=dev-${{ github.sha }}
            MYRIAD_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
          platforms: linux/amd64

      - name: Summary
        if: steps.check.outputs.present == 'true'
        run: |
          {
            echo "## ${{ matrix.component }} dev image pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "> Production releases use \`release.yml\` (push a \`v*\` tag)."
          } >> "$GITHUB_STEP_SUMMARY"
