name: CI

on:
  pull_request:
    branches: [main, preview, beta]
  push:
    # Post-merge gate for production line only; avoid double-run when PRs merge into preview/beta
    branches: [main]
  # Path filters on PRs are hand-maintained; a missed cross-tree read would let
  # a PR skip a job it can break. PR merges into preview/beta get no push run,
  # so a nightly full run on the default branch (preview) bounds that window.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR pushes are cancelled; a newer push to main must not
  # cancel the post-merge gate of the commit before it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Rust caches (Swatinem/rust-cache) are saved only by non-PR runs. A PR's cache
# lives under refs/pull/N/merge and no other PR can read it, so saving per PR
# only churned the 10 GB repo quota and evicted everything (every job was a
# cold build). Base-branch caches written by push/nightly runs are readable by
# every PR targeting that branch. The root workspace jobs share one key; only
# the backend job saves it because it builds the superset of their artifacts.

jobs:
  # Path gate: on PRs each job runs only when its module (or something its
  # tests read across trees) changed. Push to main, the nightly schedule and
  # manual dispatch run everything. Editing this workflow reruns everything.
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend_contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend_contracts == 'true' }}
      frontend_build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend_build == 'true' }}
      frontend_browser: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend_browser == 'true' }}
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      proxy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.proxy == 'true' }}
      updater: ${{ github.event_name != 'pull_request' || steps.filter.outputs.updater == 'true' }}
      smoke: ${{ github.event_name != 'pull_request' || steps.filter.outputs.smoke == 'true' }}
      audit: ${{ github.event_name != 'pull_request' || steps.filter.outputs.audit == 'true' }}
      tapp_cli: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tapp_cli == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
              - .github/actions/**
            rust_toolchain: &rust_toolchain
              - rust-toolchain.toml
            frontend_build: &frontend_build
              - *workflow
              - frontend/**
              - shared/**
            frontend_browser:
              - *frontend_build
              # Fixtures read by the browser round-trip spec.
              - crates/myriad-phantasi-notes/testdata/**
            frontend_contracts:
              - *frontend_build
              - tests/merope/**
              # Unit contract tests read these sources directly.
              - backend/src/**
              - crates/**
              - docs/development/**
              - proxy/src/main.rs
            backend:
              - *workflow
              - *rust_toolchain
              - Cargo.toml
              - Cargo.lock
              - .cargo/**
              - backend/**
              - crates/**
              - tools/tapp-contract-export/**
              - shared/**
              - tests/merope/**
              # include_str! targets
              - docs/development/**
              - docs/features/**
            proxy:
              - *workflow
              - *rust_toolchain
              - proxy/**
            updater:
              - *workflow
              - *rust_toolchain
              - updater/**
              # Read by updater tests and the deployment compatibility script.
              - docs/deployment/**
              - scripts/extra/test-deployment-compatibility.py
              - scripts/extra/deploy.sh
              - .env.production.example
              - docker-compose.yml
              - .github/workflows/release.yml
            smoke:
              - *workflow
              - *rust_toolchain
              - Cargo.toml
              - Cargo.lock
              - backend/**
              - crates/**
              - frontend/**
              - shared/**
              - scripts/extra/smoke.sh
            audit:
              - *workflow
              - .cargo/audit.toml
              - .github/dependency-audit/**
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - frontend/package.json
              - frontend/pnpm-lock.yaml
              - frontend/pnpm-workspace.yaml
            tapp_cli:
              - *workflow
              - *rust_toolchain
              - Cargo.toml
              - Cargo.lock
              - tools/tapp-cli/**
              - tools/tapp-contract-export/**
              - crates/**

  # Split so backend-only changes rerun just the contract tests that read
  # backend/crate sources, not the build, budget and browser suites.
  frontend-contracts:
    name: Frontend unit and static checks
    needs: changes
    if: needs.changes.outputs.frontend_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-frontend
      - name: Unit and static checks
        run: pnpm test

  frontend-build:
    name: Frontend build and first-paint budget
    needs: changes
    if: needs.changes.outputs.frontend_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-frontend
      - name: Production build
        run: pnpm build
      - name: Home first-paint budget
        run: pnpm test:home-budget

  # ~300 specs on one worker took ~9 min serially and gated the whole run.
  # The suite serves itself from a Vite dev server (no production build
  # needed), so shards run on separate runners with no shared state.
  frontend-browser:
    name: Frontend browser regression (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.frontend_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-frontend
        with:
          playwright: 'true'
      - name: Browser regression (mock providers)
        run: pnpm test:browser --shard=${{ matrix.shard }}/3

  backend:
    name: Backend contracts and lints
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Virtual workspace at repo root (backend + migrations + tapp-contract)
          workspaces: .
          shared-key: workspace
          save-if: ${{ github.event_name != 'pull_request' }}
      # Clippy type-checks every target, so a separate `cargo check` pass only
      # repeated the work. Running it first keeps lint/type errors fast-failing.
      # cwd=backend still resolves the root workspace; --workspace prevents
      # default-members from hiding a package from this gate.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Runs the whole suite, not just `cargo test tapp`. None of these tests
      # need a database — they were simply never wired into CI, so ~900 of them
      # had never run here.
      #
      # Opt-in database scenarios run in the schema-drift job below. Live-model
      # probes and manual asset reprocessing remain excluded from this suite.
      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked

  proxy:
    name: Proxy tests and lints
    needs: changes
    if: needs.changes.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proxy
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Format proxy
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Proxy tests
        run: cargo test --all-targets --locked

  updater:
    name: Updater tests and lints
    needs: changes
    if: needs.changes.outputs.updater == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: updater
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: updater
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # The updater holds the highest-privilege paths in the system (Docker
      # socket, pgdata snapshots, image tags) and had no CI coverage at all.
      - name: Deployment compatibility
        run: python3 ../scripts/extra/test-deployment-compatibility.py
      - name: Updater tests
        run: cargo test --all-targets --locked

  business-smoke:
    name: Real backend business smoke
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: myriad_smoke
          POSTGRES_USER: myriad
          POSTGRES_PASSWORD: myriad_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MYRIAD_SMOKE_DATABASE_URL: postgres://myriad:myriad_smoke@127.0.0.1:5432/myriad_smoke
      JWT_SECRET: smoke-jwt-key-abcdefghijklmnopqrstuvwxyz012
      MYRIAD_SETUP_SECRET: smoke-setup-secret
      ENVIRONMENT: development
      MYRIAD_SMOKE_BACKEND_PORT: 18103
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: workspace
          save-if: false
      - uses: ./.github/actions/setup-frontend
        with:
          playwright: 'true'
      - name: Business API smoke
        run: bash scripts/extra/smoke.sh

  schema-drift:
    name: Migrations vs schema_check drift gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The expected schema is declared twice: in `migrations/` and again as 49
    # TableDefs / 554 ColumnDefs in `db/schema_check.rs`. Nothing kept them in
    # sync, and they had drifted by 7 items — meaning a fresh install only got a
    # correct schema because the runtime healer patched it at startup.
    #
    # This job asserts the invariant that makes the duplication safe:
    # a freshly-migrated database needs zero healing.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: myriad_drift
          POSTGRES_USER: myriad
          POSTGRES_PASSWORD: myriad_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: workspace
          save-if: false
      - name: Assert migrations leave no schema drift
        env:
          MYRIAD_SCHEMA_DRIFT_DB: postgres://myriad:myriad_ci@127.0.0.1:5432/myriad_drift
        run: cargo test --workspace --locked migrations_leave_no_schema_drift -- --nocapture
      - name: Federation outbox and delivery lease database contracts
        env:
          MYRIAD_SCHEMA_DRIFT_DB: postgres://myriad:myriad_ci@127.0.0.1:5432/myriad_drift
        run: cargo test --workspace --locked federation_outbox_and_delivery_lease_db_contracts -- --nocapture
      # --workspace (not -p myriad-backend) keeps the feature set identical to
      # the step above; -p re-resolved features and rebuilt a third of the
      # graph. The test-path filters already scope these to the backend.
      - name: AI quota batching and concurrency contracts
        env:
          AI_QUOTA_TEST_DATABASE_URL: postgres://myriad:myriad_ci@127.0.0.1:5432/myriad_drift
        run: cargo test --workspace --locked services::ai_quota::database_tests -- --ignored --nocapture
      - name: Site owner resolution query
        env:
          # The test shadows `users` with a session-local temp table.
          SITE_OWNER_TEST_DATABASE_URL: postgres://myriad:myriad_ci@127.0.0.1:5432/myriad_drift
        run: cargo test --workspace --locked services::site_owner::tests -- --ignored --nocapture
      - name: Native Work loop database and provider contracts
        env:
          # Debug Work futures exceed the test harness default 2 MiB stack.
          RUST_MIN_STACK: 16777216
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: myriad
          PGPASSWORD: myriad_ci
          MYRIAD_WORK_TEST_DATABASE_URL: postgres://myriad:myriad_ci@127.0.0.1:5432/myriad_work_loop_test
        run: |
          createdb myriad_work_loop_test
          cargo test --workspace --locked services::agent::work_loop:: -- --ignored --skip configured_model_search_read_save_business_acceptance --skip work_process_fixture --test-threads=1 --nocapture

  dependency-audit:
    name: Dependency vulnerability scan
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            proxy
            updater
          # Only `cargo metadata` runs here; keep the registry, skip targets.
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}
      # Prebuilt binary; `cargo install` compiled it from source (~3 min).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # cargo-audit has no --locked flag of its own. Resolve metadata with
      # Cargo's lock enforcement, then point audit at the exact committed lock.
      - name: Verify backend workspace lockfile
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Verify proxy lockfile
        working-directory: proxy
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Verify updater lockfile
        working-directory: updater
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Prove rkyv stays out of the resolved graph
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/resolved-dependencies.json"
          python3 - "$RUNNER_TEMP/resolved-dependencies.json" <<'PYTHON'
          import json
          import sys
          with open(sys.argv[1]) as source:
              graph = json.load(source)
          resolved = {node['id'] for node in graph['resolve']['nodes']}
          if any(package['name'] == 'rkyv' and package['id'] in resolved for package in graph['packages']):
              sys.exit('rkyv reappeared after rust_decimal 1.43 dropped it; restore or upgrade past RUSTSEC-2026-0235')
          PYTHON
      # MYR-027: hard-fail on unignored *vulnerabilities*; soft-report warnings
      # (unmaintained/unsound/yanked). Allowlist: .cargo/audit.toml.
      # Soft steps keep continue-on-error; hard steps do not.
      - name: Audit backend workspace (hard — vulnerabilities)
        # Workspace lockfile lives at repo root; config: .cargo/audit.toml
        run: cargo audit --file Cargo.lock
      - name: Audit proxy crates (hard — vulnerabilities)
        working-directory: proxy
        run: cargo audit --file Cargo.lock
      - name: Audit updater crates (hard — vulnerabilities)
        working-directory: updater
        run: cargo audit --file Cargo.lock
      - name: Audit backend workspace (soft — warnings)
        run: cargo audit --file Cargo.lock --deny warnings
        continue-on-error: true
      - name: Audit proxy crates (soft — warnings)
        working-directory: proxy
        run: cargo audit --file Cargo.lock --deny warnings
        continue-on-error: true
      - name: Audit updater crates (soft — warnings)
        working-directory: updater
        run: cargo audit --file Cargo.lock --deny warnings
        continue-on-error: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      # High/critical hard-fail. Overrides + ignoreGhsas in frontend/package.json
      # (see .github/dependency-audit/README.md). Moderate/low reported softly.
      - name: Audit frontend dependencies (hard — high/critical)
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Audit frontend dependencies (soft — full report)
        working-directory: frontend
        run: pnpm audit
        continue-on-error: true

  tapp-cli:
    name: Tapp CLI contract and tests
    needs: changes
    if: needs.changes.outputs.tapp_cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/tapp-cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@1.98
      - name: Install dependencies
        run: npm ci
      - name: Regenerate contract
        run: npm run sync-contract
      - name: Verify generated contract is committed
        run: git diff --exit-code -- src/generated
      - name: Test
        run: npm test
      - name: Verify publish package
        run: npm run pack:check
