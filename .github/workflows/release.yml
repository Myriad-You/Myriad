name: Release

# Triggered by pushing a tag matching v*.
# Builds component images as multi-arch linux/amd64 + linux/arm64 on native
# runners (no QEMU), then assembles release.json and publishes a GitHub Release.
#
# backend/frontend always ship with the app tag. proxy/updater keep an independent
# cadence: built and listed in release.json only when their trees changed since
# the previous v* tag (no retag / no version alignment). Force-include via
# commit title `-full` on the tagged commit, or workflow_dispatch force_infra.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to (re)release, e.g. v0.1.0"
        required: true
      channel:
        description: "Channel"
        required: true
        default: "stable"
        type: choice
        options: [stable, beta, nightly]
      force_infra:
        description: "Also ship proxy/updater even if unchanged since previous tag"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  # Docker Hub namespace = DOCKERHUB_USERNAME secret. Forks set their own
  # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN; nothing in this file is hardcoded.
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  resolve:
    name: Resolve version & components
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      channel: ${{ steps.out.outputs.channel }}
      prerelease: ${{ steps.out.outputs.prerelease }}
      build_components: ${{ steps.out.outputs.build_components }}
      previous_version: ${{ steps.out.outputs.previous_version }}
      has_frontend: ${{ steps.out.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: out
        env:
          DISPATCH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_infra || false }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            # tag like v1.2.3-beta.1 -> beta channel; -nightly.* -> nightly; otherwise stable
            case "$VERSION" in
              *-nightly.*) CHANNEL=nightly ;;
              *-beta.*)    CHANNEL=beta ;;
              *)           CHANNEL=stable ;;
            esac
          fi
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$'; then
            echo "::error::Invalid version tag: $VERSION"
            exit 1
          fi
          [ "$CHANNEL" = "stable" ] && PRERELEASE=false || PRERELEASE=true

          # Force infra: dispatch checkbox, or tagged commit title contains `-full`.
          FORCE_INFRA=false
          if [ "$DISPATCH_FORCE" = "true" ]; then
            FORCE_INFRA=true
          fi
          TITLE=$(git log -1 --format=%s HEAD 2>/dev/null || true)
          if printf '%s\n' "$TITLE" | grep -qF -- '-full'; then
            FORCE_INFRA=true
            echo "Tagged commit title contains -full — forcing proxy/updater"
          fi
          echo "Commit title: ${TITLE:-n/a}"

          git fetch --tags --force origin 2>/dev/null || true
          PREV=$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$' \
            | grep -vxF "$VERSION" \
            | head -1 || true)

          # App images always ship. Infra images only when their tree changed
          # (or first release / -full / force_infra) — omitted from release.json otherwise.
          BUILD_JSON='["backend","frontend"]'
          SKIPPED=''

          for comp in proxy updater; do
            ship=false
            if [ "$FORCE_INFRA" = "true" ]; then
              ship=true
              echo "$comp: force_infra/-full — will ship"
            elif [ -z "$PREV" ]; then
              ship=true
              echo "$comp: no previous tag — will ship"
            elif git diff --name-only "$PREV" HEAD -- "$comp/" | grep -q .; then
              ship=true
              echo "$comp: changed since $PREV — will ship"
              git diff --name-only "$PREV" HEAD -- "$comp/" | head -n 20
            else
              echo "$comp: unchanged since $PREV — omit from this release"
              SKIPPED="${SKIPPED}${SKIPPED:+,}${comp}"
            fi
            if [ "$ship" = "true" ]; then
              BUILD_JSON=$(echo "$BUILD_JSON" | jq -c --arg c "$comp" '. + [$c]')
            fi
          done

          HAS_FRONTEND=false
          echo "$BUILD_JSON" | jq -e 'index("frontend") != null' >/dev/null && HAS_FRONTEND=true

          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "build_components=$BUILD_JSON"
            echo "previous_version=$PREV"
            echo "has_frontend=$HAS_FRONTEND"
          } >>"$GITHUB_OUTPUT"

          {
            echo "## Release plan \`$VERSION\`"
            echo ""
            echo "- Channel: \`$CHANNEL\`"
            echo "- Previous tag: \`${PREV:-none}\`"
            echo "- Ship images: \`$BUILD_JSON\`"
            echo "- Omitted (unchanged infra): \`${SKIPPED:-none}\`"
            echo "- force_infra (-full): \`$FORCE_INFRA\`"
            echo "- Commit title: \`${TITLE:-n/a}\`"
          } >>"$GITHUB_STEP_SUMMARY"

  # Arch-independent frontend dist — built once, reused by both platform runtimes.
  frontend-assets:
    name: Build frontend assets
    needs: resolve
    if: needs.resolve.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export frontend dist
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          target: export
          outputs: type=local,dest=frontend-export
          build-args: |
            MYRIAD_VERSION=${{ needs.resolve.outputs.version }}
            MYRIAD_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend-assets
          cache-to: type=gha,scope=frontend-assets,mode=max
          provenance: false

      - name: Upload frontend export
        uses: actions/upload-artifact@v7
        with:
          name: frontend-export
          path: frontend-export
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.component }} (${{ matrix.platform }})
    needs: [resolve, frontend-assets]
    if: |
      always()
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.build_components != '[]'
      && (needs.frontend-assets.result == 'success' || needs.frontend-assets.result == 'skipped')
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.resolve.outputs.build_components) }}
        platform: [linux/amd64, linux/arm64]
    env:
      # Job-level env cannot reference the env context; use secrets + literal host.
      REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/myriad-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute dockerfile path
        id: paths
        run: |
          case "${{ matrix.component }}" in
            backend)  echo "dockerfile=docker/Dockerfile.backend"  >>"$GITHUB_OUTPUT" ;;
            frontend) echo "dockerfile=docker/Dockerfile.frontend" >>"$GITHUB_OUTPUT" ;;
            proxy)    echo "dockerfile=proxy/Dockerfile"           >>"$GITHUB_OUTPUT" ;;
            updater)  echo "dockerfile=updater/Dockerfile"         >>"$GITHUB_OUTPUT" ;;
          esac
          platform="${{ matrix.platform }}"
          echo "platform_pair=${platform//\//-}" >>"$GITHUB_OUTPUT"

      - name: Check Dockerfile presence
        id: check
        run: |
          if [ -f "${{ steps.paths.outputs.dockerfile }}" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::Dockerfile ${{ steps.paths.outputs.dockerfile }} not present; skipping build for ${{ matrix.component }}"
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Download frontend assets
        if: steps.check.outputs.present == 'true' && matrix.component == 'frontend'
        uses: actions/download-artifact@v8
        with:
          name: frontend-export
          path: frontend-export

      - name: Set up Buildx
        if: steps.check.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push by digest
        if: steps.check.outputs.present == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.paths.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: runtime
          build-contexts: ${{ matrix.component == 'frontend' && 'assets=./frontend-export' || '' }}
          build-args: |
            MYRIAD_VERSION=${{ needs.resolve.outputs.version }}
            MYRIAD_COMMIT_SHA=${{ github.sha }}
            CARGO_PROFILE=ci-release
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ steps.paths.outputs.platform_pair }}
          cache-to: type=gha,scope=${{ matrix.component }}-${{ steps.paths.outputs.platform_pair }},mode=max
          provenance: false

      - name: Export digest
        if: steps.check.outputs.present == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.component }}-${{ steps.paths.outputs.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

      - name: Emit absent marker
        if: steps.check.outputs.present != 'true'
        run: |
          mkdir -p /tmp/digests
          : >"/tmp/digests/ABSENT"

      - name: Upload absent marker
        if: steps.check.outputs.present != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.component }}-${{ steps.paths.outputs.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Manifest ${{ matrix.component }}
    needs: [resolve, build]
    if: |
      always()
      && needs.resolve.result == 'success'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.resolve.outputs.build_components) }}
    env:
      # Job-level env cannot reference the env context; use secrets + literal host.
      REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/myriad-${{ matrix.component }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Skip if Dockerfile was absent
        id: gate
        run: |
          if [ -f /tmp/digests/ABSENT ]; then
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::warning::Skipping manifest for ${{ matrix.component }} (Dockerfile absent)"
            mkdir -p _digests
            : >"_digests/${{ matrix.component }}.absent"
          else
            echo "present=true" >>"$GITHUB_OUTPUT"
            ls -1 /tmp/digests
          fi

      - name: Set up Buildx
        if: steps.gate.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.gate.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        if: steps.gate.outputs.present == 'true'
        id: manifest
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${{ env.REGISTRY_IMAGE }}:${VERSION}"
          # Only digest filenames (64 hex chars); ignore markers like ABSENT.
          set --
          for f in *; do
            if printf '%s' "$f" | grep -Eq '^[0-9a-f]{64}$'; then
              set -- "$@" "$f"
            fi
          done
          if [ "$#" -lt 1 ]; then
            echo "::error::No per-arch digests found for ${{ matrix.component }}"
            exit 1
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$TAG" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' "$@")
          # Resolve manifest-list digest for release.json (not a single-arch image).
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "<nil>" ]; then
            DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{.Image.Digest}}')
          fi
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "<nil>" ]; then
            echo "::error::Could not resolve manifest digest for $TAG"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/_digests"
          echo "$DIGEST" >"$GITHUB_WORKSPACE/_digests/${{ matrix.component }}.digest"
          echo "$TAG" >"$GITHUB_WORKSPACE/_digests/${{ matrix.component }}.ref"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.component }}
          path: _digests/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [resolve, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for cosign keyless OIDC signing.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - uses: actions/download-artifact@v8
        with:
          path: _digests
          pattern: digest-*
          merge-multiple: true

      - name: Assemble release.json
        id: assemble
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          NS="${{ env.IMAGE_NAMESPACE }}"
          REG="${{ env.REGISTRY }}"
          REPO="${{ github.repository }}"

          # Only components shipped this release (proxy/updater may be omitted).
          IMAGES=$(jq -n '{}')
          for comp in backend frontend proxy updater; do
            if [ -f "_digests/${comp}.absent" ]; then
              echo "Skipping $comp (no Dockerfile this release)"
              continue
            fi
            if [ ! -f "_digests/${comp}.digest" ]; then
              echo "Omitting $comp (not shipped this release — independent cadence)"
              continue
            fi
            digest=$(cat "_digests/${comp}.digest")
            ref="${REG}/${NS}/myriad-${comp}:${VERSION}"
            IMAGES=$(echo "$IMAGES" | jq --arg c "$comp" --arg r "$ref" --arg d "$digest" \
              '.[$c] = {ref: $r, digest: $d}')
          done
          # backend + frontend are mandatory for a business release.
          echo "$IMAGES" | jq -e 'has("backend") and has("frontend")' >/dev/null

          NOTES_URL="https://github.com/${REPO}/releases/tag/${VERSION}"

          # Compatibility floor: major updater changes landed at v0.3.0.
          # Do NOT default min_from_version / min_updater_version to $version —
          # that deadlocks upgrades (current < min_from) and forces self-update
          # every release. Tighten only via release/overrides/<version>.json
          # (deep-merged after generation). example.release.json documents the
          # same policy but is not read at assemble time.
          MIN_FROM_VERSION="v0.3.0"
          MIN_UPDATER_VERSION="v0.3.0"

          jq -n \
            --arg version "$VERSION" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg channel "$CHANNEL" \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes_url "$NOTES_URL" \
            --arg min_from_version "$MIN_FROM_VERSION" \
            --arg min_updater_version "$MIN_UPDATER_VERSION" \
            --argjson images "$IMAGES" \
            '{
              schema_version: 1,
              version: $version,
              commit_sha: $commit_sha,
              channel: $channel,
              released_at: $released_at,
              min_from_version: $min_from_version,
              images: $images,
              env: { required: ["POSTGRES_PASSWORD", "JWT_SECRET", "CORS_ORIGINS"], new: [], removed: [] },
              migrations: { irreversible: false, estimated_seconds: 30, requires_full_backup: true },
              updater: { min_updater_version: $min_updater_version, self_update_required: false },
              postgres: { min_pg_version: "16", max_pg_version: "unbounded" },
              notes_url: $notes_url,
              signature: null
            }' > release.json

          # Per-release overrides at release/overrides/<version>.json are deep-merged
          # for special cases (tighten floors, env changes, etc.).
          OVERRIDE="release/overrides/${VERSION}.json"
          if [ -f "$OVERRIDE" ]; then
            jq -s '.[0] * .[1]' release.json "$OVERRIDE" > release.merged.json
            mv release.merged.json release.json
          fi

          # Validate against schema (basic structural check via jq).
          jq -e --arg commit_sha "$COMMIT_SHA" \
            'has("schema_version") and has("version") and (.commit_sha == $commit_sha) and (.images | length > 0)' \
            release.json >/dev/null

          # Host-owned docker-guard policy seed. It is emitted only when this
          # release actually ships the updater/Guard image and always pins the
          # trusted repository by the signed manifest-list digest.
          if echo "$IMAGES" | jq -e 'has("updater")' >/dev/null; then
            updater_ref=$(echo "$IMAGES" | jq -r '.updater.ref | sub(":[^/:]+$"; "")')
            updater_digest=$(echo "$IMAGES" | jq -r '.updater.digest')
            cat > docker-guard.env <<EOF
DOCKER_GUARD_IMAGE=${updater_ref}@${updater_digest}
GUARD_COMPOSE_PROJECT_NAME=myriad
GUARD_MYRIAD_DOCKER_NETWORK=myriad-net
GUARD_MYRIAD_ADMIN_NETWORK=myriad-admin-net
GUARD_MYRIAD_DOCKER_GUARD_NETWORK=myriad-docker-guard-net
MYRIAD_GUARD_ENV_FILE=/etc/myriad/docker-guard.env
EOF
          fi

          # Generate checksums.
          checksum_assets=(release.json)
          [ ! -f docker-guard.env ] || checksum_assets+=(docker-guard.env)
          sha256sum "${checksum_assets[@]}" > SHA256SUMS

          # Build a minimal changelog stub if not provided.
          if [ ! -f "CHANGELOG-fragment.md" ]; then
            {
              echo "## ${VERSION}"
              echo ""
              echo "Channel: \`${CHANNEL}\`"
              echo ""
              echo "Images:"
              jq -r '.images | to_entries[] | "- \(.key): `\(.value.ref)` (`\(.value.digest)`)"' release.json
            } > CHANGELOG-fragment.md
          fi

      - name: Sign release.json with cosign (keyless OIDC)
        env:
          # Tell cosign to use GitHub Actions OIDC token for keyless signing.
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          # Outputs:
          #   release.json.sig         — base64 cosign signature
          #   release.json.pem         — signing certificate (cosign Rekor entry binds to OIDC subject)
          cosign sign-blob \
            --yes \
            --output-signature release.json.sig \
            --output-certificate release.json.pem \
            release.json
          # Also sign SHA256SUMS so verifiers can audit asset integrity end-to-end.
          cosign sign-blob \
            --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
          if [ -f docker-guard.env ]; then
            cosign sign-blob \
              --yes \
              --output-signature docker-guard.env.sig \
              --output-certificate docker-guard.env.pem \
              docker-guard.env
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          guard_assets=()
          if [ -f docker-guard.env ]; then
            guard_assets=(docker-guard.env docker-guard.env.sig docker-guard.env.pem)
          fi
          gh release create "${{ needs.resolve.outputs.version }}" \
            --title "${{ needs.resolve.outputs.version }}" \
            --target "${{ github.sha }}" \
            --notes-file CHANGELOG-fragment.md \
            --prerelease=${{ needs.resolve.outputs.prerelease }} \
            release.json release.json.sig release.json.pem \
            SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem \
            "${guard_assets[@]}"

      - name: Summary
        run: |
          {
            echo "## Released ${{ needs.resolve.outputs.version }}"
            echo ""
            echo '### release.json'
            echo '```json'
            cat release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
